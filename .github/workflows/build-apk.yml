name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Apply React Native compatibility patch
        run: npx patch-package --error-on-fail

      - name: Verify patched React Native header
        run: grep -n 'std::to_string(dimension.value) + "%"' node_modules/react-native/ReactCommon/react/renderer/core/graphicsConversions.h

      - name: Create .env file for build
        run: echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
